[pytest]
pythonpath = .
testpaths = tests
markers =
    network: hits the FastF1 backend over the network; excluded from the default run
    docker: brings the compose stack up on the local Docker daemon; excluded from the default run
    data: needs the ingested session under data/; excluded from the default run because a clone has no data/
# Opt-in suites: `pytest -m network`, `pytest -m docker`, `pytest -m data`.
addopts = -m "not network and not docker and not data" -q --strict-markers
